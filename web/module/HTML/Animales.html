<div class="container mt-4">
    <h2 class="text-center mb-4">Listado de Animales</h2>

    <button id="btnAgregarAnimal" class="btn btn-success mb-3">Agregar Animal</button>

    <div class="row" id="contenedorAnimales"></div>
</div>

<div class="modal fade" id="modalAnimal" tabindex="-1" aria-labelledby="tituloModalAnimal" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="tituloModalAnimal">Nuevo Animal</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <div class="modal-body">
                <form id="formAnimal">

                    <div class="mb-2">
                        <label for="animalNombre" class="form-label">Nombre:</label>
                        <input type="text" id="animalNombre" class="form-control" required>
                    </div>

                    <div class="mb-2">
                        <label for="animalEdad" class="form-label">Edad:</label>
                        <input type="number" id="animalEdad" class="form-control" min="0" required>
                    </div>

                    <div class="mb-2">
                        <label for="animalRaza" class="form-label">Raza:</label>
                        <input type="text" id="animalRaza" class="form-control" required>
                    </div>

                    <div class="mb-2">
                        <label for="animalSexo" class="form-label">Sexo:</label>
                        <select id="animalSexo" class="form-select">
                            <option value="Macho">Macho</option>
                            <option value="Hembra">Hembra</option>
                        </select>
                    </div>

                    <div class="mb-2">
                        <label for="animalSalud" class="form-label">Salud:</label>
                        <input type="text" id="animalSalud" class="form-control" placeholder="Ej: Saludable, En tratamiento...">
                    </div>

                    <div class="mb-2">
                        <label for="animalTipo" class="form-label">Tipo:</label>
                        <select id="animalTipo" class="form-select" required>
                            <option value="">Seleccione un tipo...</option>
                        </select>
                    </div>

                    <div class="mb-2">
                        <label for="animalRefugio" class="form-label">Refugio:</label>
                        <select id="animalRefugio" class="form-select" required>
                            <option value="">Seleccione un refugio...</option>
                        </select>
                    </div>

                    <div class="mb-2">
                        <label for="animalImagen" class="form-label">URL de la Imagen:</label>
                        <input type="text" id="animalImagen" class="form-control" placeholder="">
                    </div>

                    <div class="mt-3">
                        <button id="btnSubmitAnimal" class="btn btn-primary" type="submit">Guardar</button>
                        <button id="btnCancelarAnimal" class="btn btn-secondary" type="button">Cancelar</button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>

<div class="modal fade" id="modalAdopcion" tabindex="-1" aria-labelledby="tituloModalAdopcion" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="tituloModalAdopcion">Formulario de Adopción</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <div class="modal-body">
                <form id="formAdopcion">

                    <input type="hidden" id="idAnimalAdop">

                    <div class="mb-3">
                        <label for="idClienteAdop" class="form-label">ID Cliente: <span class="text-danger">*</span></label>
                        <input type="text" id="idClienteAdop" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="fechaAdopcion" class="form-label">Fecha de adopción: <span class="text-danger">*</span></label>
                        <input type="date" id="fechaAdopcion" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="observaciones" class="form-label">Observaciones:</label>
                        <textarea id="observaciones" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="mt-3">
                        <button class="btn btn-primary" type="submit">Guardar Adopción</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
