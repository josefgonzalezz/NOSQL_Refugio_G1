<body class="body-adopciones">

<div class="container contenedor-principal">

    <div class="row justify-content-center">
        <div class="col-auto">
            <h1 class="mt-4 titulo-principal">Gestión de Medicamentos</h1>
        </div>
    </div>

    <br>

    <button id="btnNuevo" class="boton-registro-adopciones">
        Registrar Medicamento
    </button>

    <div class="modal fade" id="modalMedicamento" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content contenedor-modal-adopciones">

                <div class="modal-header encabezado-modal-adopciones">
                    <h5 class="modal-title titulo-modal-adopciones">
                        Formulario de Medicamento
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body cuerpo-modal-adopciones">
                    <form id="medicamentoFormulario">

                        <div class="mb-3">
                            <label class="form-label">Animal</label>
                            <select id="idAnimal" class="form-select" required></select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nombre del Medicamento</label>
                            <input type="text" id="nombreMedicamento" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Dosis</label>
                            <input type="text" id="dosis" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Fecha de Vencimiento</label>
                            <input type="date" id="fechaVencimiento" class="form-control" required>
                        </div>

                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-success" id="btnGuardar">Guardar</button>
                            <button type="button" class="btn btn-secondary" id="btnCancelar">Cancelar</button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>

    <div class="table-responsive mt-5">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Animal</th>
                    <th>Nombre</th>
                    <th>Dosis</th>
                    <th>Vencimiento</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaMedicamentos"></tbody>
        </table>
    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
