    <div class="container mt-4">
        <h1 class="text-center mb-4">Gestión de Personal</h1>

        <button id="btnAgregarPersonal" class="btn btn-success mb-3">
            + Agregar Personal
        </button>

        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-success">
                    <tr>
                        <th scope="col">Refugio</th>
                        <th scope="col">Nombre</th>
                        <th scope="col">Puesto</th>
                        <th scope="col">Teléfono</th>
                        <th scope="col">Correo</th>
                        <th scope="col" style="width: 150px;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaPersonal"></tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="modalPersonal" tabindex="-1" aria-labelledby="tituloModalPersonal" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">

                <form id="formPersonal">
                    <div class="modal-header">
                        <h5 class="modal-title" id="tituloModalPersonal">Registrar personal</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>

                    <div class="modal-body">
                        <input type="hidden" id="personalId">

                        <div class="mb-3">
                            <label for="personalRefugio" class="form-label">Refugio</label>
                            <select id="personalRefugio" class="form-select" required>
                                <option value="">Seleccione un refugio</option>
                            </select>
                            <small class="form-text text-muted">
                                Refugio al que pertenece la persona.
                            </small>
                        </div>

                        <div class="mb-3">
                            <label for="personalNombre" class="form-label">Nombre</label>
                            <input type="text" id="personalNombre" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="personalPuesto" class="form-label">Puesto</label>
                            <input type="text" id="personalPuesto" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="personalTelefono" class="form-label">Teléfono</label>
                            <input type="tel" id="personalTelefono" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="personalCorreo" class="form-label">Correo</label>
                            <input type="email" id="personalCorreo" class="form-control" required>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button id="btnCancelarPersonal" type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Cancelar
                        </button>
                        <button id="btnGuardarPersonal" type="submit" class="btn btn-primary">
                            Guardar
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
